name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.semgrep/**'
      - '.semgrepignore'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.semgrep/**'
      - '.semgrepignore'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  fix-lockfile:
    name: Fix Lock File (Dependabot)
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Regenerate lock file
        working-directory: backend
        run: |
          echo "Regenerating package-lock.json..."
          npm install --package-lock-only
          echo "Lock file regenerated"

      - name: Check for changes
        id: changes
        working-directory: backend
        run: |
          if git diff --quiet package-lock.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to lock file"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Lock file has changes"
          fi

      - name: Commit lock file changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore(backend): regenerate package-lock.json for Dependabot"
          git push

  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: fix-lockfile
    if: always() && (needs.fix-lockfile.result == 'success' || needs.fix-lockfile.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: backend
        run: npm run type-check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: fix-lockfile
    if: always() && (needs.fix-lockfile.result == 'success' || needs.fix-lockfile.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run npm audit
        working-directory: backend
        run: |
          echo "Running npm audit..."
          # Known false positives that do not affect this project:
          # GHSA-37qj-frw5-hhjh: fast-xml-parser RangeError DoS via numeric entities
          #   - Transitive dependency via AWS SDK v3 (@aws-sdk/xml-builder)
          #   - Only exploitable when parsing untrusted XML with numeric entities
          #   - Our backend does not parse untrusted XML; safe to exclude
          # GHSA-fj3w-jwp8-x2g3: fast-xml-parser stack overflow in XMLBuilder with preserveOrder
          #   - Transitive dependency via AWS SDK v3 (@aws-sdk/xml-builder)
          #   - Only exploitable when using XMLBuilder with preserveOrder option
          #   - AWS SDK does not use preserveOrder; safe to exclude
          # GHSA-w5hq-g745-h8pq: uuid missing buffer bounds check in v3/v5/v6
          #   - Transitive dependency via aws-lambda -> aws-sdk v2 and direct uuid v9
          #   - Only exploitable when passing a custom buf argument to uuid functions
          #   - This project does not pass custom buffers to uuid; safe to exclude
          IGNORED_ADVISORIES="GHSA-37qj-frw5-hhjh GHSA-fj3w-jwp8-x2g3 GHSA-w5hq-g745-h8pq"

          # Run audit in JSON mode to enable per-advisory filtering
          npm audit --omit=dev --audit-level=moderate --json > audit-report.json 2>&1 || true

          # Check if there are any vulnerabilities not in our ignore list
          node -e "
            const report = require('./audit-report.json');
            const ignored = '${IGNORED_ADVISORIES}'.split(/[\s,]+/).filter(Boolean);
            const vulns = report.vulnerabilities || {};
            const real = [];
            for (const [name, info] of Object.entries(vulns)) {
              const advisories = (info.via || [])
                .filter(v => typeof v === 'object')
                .map(v => v.url || '')
                .map(url => url.split('/').pop());
              // Skip transitive deps whose via is only string refs to other packages
              if (advisories.length === 0) continue;
              const isIgnored = advisories.every(a => ignored.includes(a));
              if (!isIgnored) real.push(name);
            }
            if (real.length > 0) {
              console.log('Security vulnerabilities found in: ' + real.join(', '));
              console.log('Run npm audit locally for full details');
              console.log('Run npm audit fix to automatically fix issues');
              process.exit(1);
            } else if (Object.keys(vulns).length > 0) {
              console.log('All ' + Object.keys(vulns).length + ' advisory(ies) are in the known false-positive ignore list');
            }
            console.log('No actionable security vulnerabilities found');
          "

      - name: Upload audit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit-report
          path: backend/audit-report.json
          retention-days: 30

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: fix-lockfile
    if: >-
      always() &&
      (needs.fix-lockfile.result == 'success' || needs.fix-lockfile.result == 'skipped') &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Semgrep
        run: pip install semgrep==1.150.0

      - name: Run Semgrep SAST scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/security-audit \
            --config .semgrep/ \
            --sarif \
            --output=semgrep-backend.sarif \
            --error \
            --severity=ERROR \
            backend/src/

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.semgrep.outcome != 'cancelled'
        continue-on-error: true
        with:
          sarif_file: semgrep-backend.sarif
          category: semgrep-backend

      - name: Comment scan results on PR
        if: always() && github.event_name == 'pull_request' && steps.semgrep.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const sarifFile = 'semgrep-backend.sarif';

            if (!fs.existsSync(sarifFile)) {
              console.log('No SARIF file found, skipping comment');
              return;
            }

            const sarif = JSON.parse(fs.readFileSync(sarifFile, 'utf8'));
            const results = sarif.runs?.[0]?.results || [];

            if (results.length === 0) return;

            const errorCount = results.filter(r => r.level === 'error').length;
            const warningCount = results.filter(r => r.level === 'warning').length;
            const noteCount = results.filter(r => r.level === 'note').length;

            let body = `### Semgrep SAST Scan Results (Backend)\n\n`;
            body += `| Severity | Count |\n|----------|-------|\n`;
            if (errorCount > 0) body += `| Error | ${errorCount} |\n`;
            if (warningCount > 0) body += `| Warning | ${warningCount} |\n`;
            if (noteCount > 0) body += `| Note | ${noteCount} |\n`;
            body += `\n`;

            if (errorCount > 0) {
              body += `**ERROR-level findings will block merge.** Review in the Security tab.\n\n`;
            }

            const topFindings = results.slice(0, 5);
            body += `<details><summary>Top findings (${Math.min(5, results.length)} of ${results.length})</summary>\n\n`;
            for (const result of topFindings) {
              const loc = result.locations?.[0]?.physicalLocation;
              const file = loc?.artifactLocation?.uri || 'unknown';
              const line = loc?.region?.startLine || '?';
              const msg = result.message?.text?.substring(0, 150) || '';
              body += `- **${result.ruleId}** (${result.level}): ${msg}...\n`;
              body += `  \`${file}:${line}\`\n`;
            }
            body += `\n</details>\n`;

            // Delete old Semgrep backend comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.body?.includes('Semgrep SAST Scan Results (Backend)')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on critical findings
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep SAST scan found ERROR-severity findings in backend code."
          echo "Review the findings in the GitHub Security tab or the step output above."
          echo "To run locally: pip install semgrep && semgrep --config p/owasp-top-ten --config p/typescript --config p/security-audit --config .semgrep/ --severity=ERROR backend/src/"
          exit 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: fix-lockfile
    if: always() && (needs.fix-lockfile.result == 'success' || needs.fix-lockfile.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ./backend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  contract-tests:
    name: Contract Tests (OpenAPI Compliance)
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests]
    if: always() && needs.lint-and-type-check.result == 'success' && needs.unit-tests.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate OpenAPI Spec
        working-directory: backend
        run: npm run validate:openapi

      - name: Run Contract Tests
        working-directory: backend
        run: npm run test:contract

      - name: Upload contract test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: backend/coverage/
          retention-days: 7

  build:
    name: Build Lambda Functions
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests, contract-tests]
    if: always() && needs.lint-and-type-check.result == 'success' && needs.unit-tests.result == 'success' && needs.contract-tests.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Check bundle sizes
        working-directory: backend
        run: |
          echo "📊 Checking Lambda bundle sizes..."
          for bundle in dist/bundles/*/index.js; do
            if [ -f "$bundle" ]; then
              size=$(du -h "$bundle" | cut -f1)
              echo "  $bundle: $size"

              # Check if any bundle exceeds 5MB
              size_bytes=$(du -b "$bundle" | cut -f1)
              if [ $size_bytes -gt 5242880 ]; then
                echo "❌ Error: Bundle $bundle exceeds 5MB limit!"
                exit 1
              fi
            fi
          done
          echo "✅ All bundles are within size limits"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles
          path: backend/dist/bundles/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run integration tests
        working-directory: backend
        run: |
          echo "⚠️  Integration tests not yet implemented"
          echo "   Skipping for now - will be added in Step 5.2"
        # run: npm run test:integration
        env:
          AWS_REGION: us-east-1
          # AWS credentials and environment variables would be configured here

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [fix-lockfile, lint-and-type-check, security-audit, sast-scan, unit-tests, contract-tests, build]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          # Check fix-lockfile (only runs for Dependabot, skipped otherwise)
          if [ "${{ needs.fix-lockfile.result }}" != "skipped" ] && \
             [ "${{ needs.fix-lockfile.result }}" != "success" ]; then
            echo "Lock file fix failed"
            exit 1
          fi

          # Check SAST scan (skipped for Dependabot PRs)
          if [ "${{ needs.sast-scan.result }}" != "skipped" ] && \
             [ "${{ needs.sast-scan.result }}" != "success" ]; then
            echo "SAST scan failed - review Semgrep findings in the Security tab"
            exit 1
          fi

          # Check required jobs
          if [ "${{ needs.lint-and-type-check.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.contract-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
